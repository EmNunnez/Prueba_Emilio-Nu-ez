<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechGaming - Iniciar Sesión</title>
    <link rel="stylesheet" href="../Assets/css/estilos.css">
</head>
<body>
    <header class="main-header" style="justify-content: center;">
        <div class="logo">
            <a href="../Página/index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 8px;">
                <span class="square-icon">■</span>
                <h1>TechGaming</h1>
            </a>
        </div>
    </header>

    <main class="container" style="max-width: 400px; margin: 40px auto;">
        <h2 style="color: #38bdf8; text-align: center; margin-bottom: 20px;">Iniciar Sesión</h2>
        
        <form id="login-form" style="background: #1e293b; padding: 25px; border-radius: 8px; border: 1px solid #334155;">
            <div style="margin-bottom: 15px;">
                <label style="color: #f8fafc; display: block; margin-bottom: 5px;">Correo Electrónico *:</label>
                <input type="email" id="login-email" required placeholder="ejemplo@correo.com" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="color: #f8fafc; display: block; margin-bottom: 5px;">Contraseña *:</label>
                <input type="password" id="login-password" required style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box;">
            </div>
            
            <button type="submit" style="width: 100%; background: #0284c7; color: #fff; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 12px;">Ingresar</button>
            
            <!-- Botón del Login: Redirige directamente al inicio -->
            <a href="../Página/index.html" style="display: block; width: 100%; text-align: center; background: #334155; color: #f8fafc; text-decoration: none; padding: 10px; border-radius: 4px; font-weight: bold; box-sizing: border-box;">
                ← Volver al Inicio
            </a>

            <p style="color: #94a3b8; text-align: center; margin-top: 20px; font-size: 0.9rem;">
                ¿No tienes cuenta? <a href="registro.html" style="color: #38bdf8; font-weight: bold;">Regístrate aquí</a>
            </p>
        </form>
    </main>

    <footer>© 2026 TechGaming. Todos los derechos reservados.</footer>
    <script src="../Assets/js/auth.js"></script>
</body>
</html>
