<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechGaming - Blogs y Noticias</title>
    <link rel="stylesheet" href="../Assets/css/estilos.css">
</head>
<body>
    <header class="main-header">
        <div class="logo"><span class="square-icon">■</span><h1>TechGaming</h1></div>
        <nav class="main-nav">
            <a href="../Página/index.html">Inicio</a>
            <a href="../Productos/productos.html">Productos</a>
            <a href="../Productos/descuentos.html">Descuentos</a>
            <a href="../Página/sobre_nosotros.html">Sobre Nosotros</a>
            <a href="blogs.html" class="active">Blogs</a>
            <a href="../Página/contacto.html">Contacto</a>
            <a href="../Administrador/admin.html" id="link-admin" style="display: none; color: #ef4444; font-weight: bold;">Admin</a>
            <a href="../Usuario/login.html" id="link-auth">Iniciar Sesión</a>
            <a href="../Usuario/registro.html" id="link-register">Registrarse</a>
        </nav>
    </header>

    <main class="container">
        <h2 style="color: #38bdf8; margin-bottom: 10px;">Blogs & Novedades Gaming</h2>
        <p style="color: #94a3b8; margin-bottom: 25px;">Mantente al día con las últimas tendencias, guías de hardware y novedades del mundo eSports.</p>

        <!-- Grid de Blogs -->
        <div id="grid-blogs" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px;">
            <!-- Carga dinámica de blogs desde blogs.js -->
        </div>
    </main>

    <!-- Modal para Leer el Blog Completo -->
    <div id="modal-blog" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px;">
        <div style="background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 750px; padding: 30px; position: relative; color: #f8fafc; max-height: 90vh; overflow-y: auto;">
            <button onclick="cerrarModalBlog()" style="position: absolute; top: 15px; right: 20px; background: none; border: none; color: #94a3b8; font-size: 1.8rem; cursor: pointer;">✕</button>
            
            <img id="blog-modal-img" src="" alt="" style="width: 100%; height: 260px; object-fit: cover; border-radius: 8px; margin-bottom: 20px;">
            
            <div style="display: flex; gap: 15px; font-size: 0.85rem; color: #38bdf8; margin-bottom: 10px; font-weight: bold;">
                <span id="blog-modal-fecha"></span>
                <span>•</span>
                <span id="blog-modal-autor"></span>
            </div>

            <h2 id="blog-modal-titulo" style="font-size: 1.6rem; color: #f8fafc; margin-bottom: 15px; line-height: 1.3;"></h2>
            
            <div id="blog-modal-contenido" style="color: #cbd5e1; font-size: 1rem; line-height: 1.7; margin-bottom: 30px; white-space: pre-line;"></div>

            <!-- Sección de Comentarios -->
            <div style="border-top: 1px solid #334155; padding-top: 20px;">
                <h3 style="color: #38bdf8; margin-bottom: 15px; font-size: 1.2rem;">Comentarios</h3>
                
                <form id="form-comentario" style="margin-bottom: 20px;">
                    <input type="text" id="comentario-nombre" placeholder="Tu Nombre o Usuario" required style="width: 100%; padding: 10px; margin-bottom: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff;">
                    <textarea id="comentario-texto" placeholder="Escribe tu comentario..." rows="3" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; resize: vertical;"></textarea>
                    <button type="submit" style="margin-top: 10px; padding: 10px 20px; background: #38bdf8; color: #020617; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Publicar Comentario</button>
                </form>

                <div id="lista-comentarios" style="display: flex; flex-direction: column; gap: 10px;">
                    <!-- Lista dinámica de comentarios -->
                </div>
            </div>
        </div>
    </div>

    <footer>© 2026 TechGaming. Todos los derechos reservados.</footer>
    <script src="../Assets/js/auth.js"></script>
    <script src="../Assets/js/main.js"></script>
    <script src="../Assets/js/blogs.js"></script>
</body>
</html>
