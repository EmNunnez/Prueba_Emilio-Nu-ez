<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechGaming - Panel Administrativo</title>
    <link rel="stylesheet" href="../Assets/css/estilos.css">
</head>
<body>
    <header class="main-header">
        <div class="logo">
            <a href="../Página/index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 8px;">
                <span class="square-icon" style="color: #ef4444;">■</span>
                <h1>Panel Admin - TechGaming</h1>
            </a>
        </div>
        <nav class="main-nav">
            <a href="../Página/index.html">Volver al Sitio</a>
        </nav>
    </header>

    <main class="container" style="margin-top: 30px; margin-bottom: 50px;">
        <h2 style="color: #ef4444; margin-bottom: 20px;">Gestión del Sistema</h2>

        <!-- Tablas de Usuarios y Productos -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 30px;">
            
            <!-- Usuarios Registrados -->
            <div style="background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155;">
                <h3 style="color: #38bdf8; margin-bottom: 15px;">Usuarios Registrados</h3>
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left; color: #f8fafc; font-size: 0.9rem;">
                        <thead>
                            <tr style="border-bottom: 2px solid #334155; color: #94a3b8;">
                                <th style="padding: 8px;">Nombre</th>
                                <th style="padding: 8px;">Correo</th>
                                <th style="padding: 8px;">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="admin-users-list">
                            <!-- Lista dinámica de usuarios -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Gestión de Productos -->
            <div style="background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155;">
                <h3 style="color: #38bdf8; margin-bottom: 15px;">Agregar Nuevo Producto</h3>
                <form id="form-add-product" style="display: flex; flex-direction: column; gap: 12px;">
                    <input type="text" id="prod-name" placeholder="Nombre del Producto" required style="padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #fff;">
                    <input type="number" id="prod-price" placeholder="Precio ($ CLP)" required style="padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #fff;">
                    <input type="url" id="prod-img" placeholder="URL Imagen" required style="padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #fff;">
                    <button type="submit" style="background: #22c55e; color: #fff; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer;">Guardar Producto</button>
                </form>
            </div>

        </div>
    </main>

    <footer>© 2026 TechGaming. Todos los derechos reservados.</footer>

    <script src="../Assets/js/auth.js"></script>
    <script src="../Assets/js/admin.js"></script>
</body>
</html>
